include:
    - compose.waha.yml

services:
    verbier-bot:
        image: ghcr.io/eliemada/verbier-whatsapp-bot:${BOT_IMAGE_TAG:-latest}
        container_name: verbier-whatsapp-bot
        restart: unless-stopped
        depends_on:
            waha:
                condition: service_healthy
        environment:
            DATA_DIR: /app/data
            WAHA_URL: http://waha:3000
            WAHA_API_KEY: ${WAHA_API_KEY:?Set WAHA_API_KEY in .env}
            WAHA_SESSION: ${WAHA_SESSION:-default}
            WEBHOOK_SECRET: ${WEBHOOK_SECRET:?Set WEBHOOK_SECRET in .env}
            WEBHOOK_URL: http://verbier-bot:3001/webhooks/waha
        volumes:
            - ${BOT_DATA_DIR:-/mnt/user/appdata/verbier-bot}:/app/data
        labels:
            com.centurylinklabs.watchtower.enable: 'false'
